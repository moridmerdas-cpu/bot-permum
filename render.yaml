services:
  - type: web
    name: instagram-manager-bot
    env: python
    pythonVersion: 3.14
    
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python main.py"
    
    envVars:
      - key: TELEGRAM_TOKEN
        scope: build,runtime
        sync: false
      - key: ADMIN_TELEGRAM_ID
        scope: build,runtime
        sync: false
      - key: ADMIN_PASSWORD
        scope: build,runtime
        sync: false
      - key: DATABASE_URL
        scope: build,runtime
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: SESSIONS_DIR
        value: /var/data/sessions
      - key: TELEGRAM_WEBHOOK_URL
        scope: build,runtime
        sync: false
    
    disk:
      name: instagram-data
      mountPath: /var/data
      sizeGB: 1
